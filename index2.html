<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>던파모바일 2.0 업데이트 중 | 게임실험연구소</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:#0f1117;color:#f5f7fb}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.wrap{width:100%;max-width:760px;text-align:center}
.brand{margin-bottom:32px}
.brand-name{font-size:18px;font-weight:700;color:#d7dbe5}
.brand-sub{margin-top:7px;font-size:12px;font-weight:600;letter-spacing:.22em;color:#777e8c}
.card{padding:64px 52px 56px;border:1px solid #2a2f3a;border-radius:24px;background:#171a21;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.badge{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;margin-bottom:28px;border:1px solid #39404d;border-radius:999px;background:#20242d;color:#c9ced8;font-size:13px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:#8b93a3;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
h1{margin:0;font-size:clamp(34px,7vw,58px);line-height:1.12;letter-spacing:-.055em;font-weight:800}
.subtitle{margin:18px 0 0;font-size:clamp(19px,3vw,24px);line-height:1.5;letter-spacing:-.035em;font-weight:700;color:#bfc5d0}
.divider{width:42px;height:2px;margin:34px auto;background:#3a414e;border-radius:999px}
.desc{margin:0 auto;max-width:560px;font-size:16px;line-height:1.85;letter-spacing:-.025em;color:#959dac;word-break:keep-all}
.desc strong{color:#dfe3eb}
.progress{margin-top:38px;padding:20px 22px;border:1px solid #292f39;border-radius:16px;background:#12151b;text-align:left}
.progress-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;font-size:13px;color:#929aa9}
.progress-head strong{color:#cdd2dc}
.track{width:100%;height:7px;border-radius:999px;background:#252a33;overflow:hidden}
.bar{width:68%;height:100%;border-radius:inherit;background:#747e91;animation:fade 2.4s ease-in-out infinite alternate}
@keyframes fade{from{opacity:.62}to{opacity:1}}
.notice{margin-top:26px;font-size:13px;line-height:1.7;color:#6f7684}
.footer{margin-top:28px;font-size:12px;letter-spacing:.06em;color:#555c69}
@media(max-width:640px){body{padding:20px 14px}.brand{margin-bottom:24px}.card{padding:48px 24px 42px;border-radius:20px}.desc{font-size:15px;line-height:1.8}.progress{padding:18px}}
</style>
</head>
<body>
<main class="wrap">
<header class="brand">
<div class="brand-name">게임실험연구소</div>
<div class="brand-sub">DNF MOBILE DAMAGE CALCULATOR</div>
</header>
<section class="card">
<div class="badge"><span class="dot"></span>UPDATE IN PROGRESS</div>
<h1>게임실험연구소 <br>던파모바일 2.0</h1>
<p class="subtitle">빠른시일내에 오픈할 수 있도록 하겠습니다</p>
<div class="divider"></div>
<p class="desc">
새로운 시즌과 변경된 시스템에 맞춰
<strong>데미지 계산기 및 관련 기능을 업데이트</strong>하고 있습니다.<br>
안정적인 계산 환경을 위해 점검이 완료된 뒤 다시 서비스를 제공하겠습니다.
</p>
<div class="progress">
<div class="progress-head"><strong>시즌 2.0 대응 작업</strong><span>업데이트 진행 중</span></div>
<div class="track"><div class="bar"></div></div>
</div>
<p class="notice">업데이트 완료 후 별도 조작 없이 정상적으로 이용하실 수 있습니다.</p>
</section>
<footer class="footer">GAME LAB · DNFM-GAMELAB.COM</footer>
</main>
</body>
</html>
